name: Hel-Pi
slug: hel_pi
description: A private, persistent chat using your ChatGPT plan.
version: 0.1.0
arch: [amd64, aarch64]
url: https://github.com/eifinger/hel-pi
startup: application
boot: auto
init: false
ingress: true
ingress_port: 8099
ingress_stream: true
panel_admin: true
panel_icon: mdi:chat-outline
backup: cold
options: {}
schema:
  direct_access_key: password?
  web_search: list(off|chatgpt|brave)?
  brave_api_key: password?
  read_web_pages: bool?
  mcp_url: url?
  mcp_token: password?
  mcp_allowed_tools: str?
